# RK-XCZU15EG-F kernel config fragment (merged onto xilinx_zynqmp_defconfig).
# Guarantees the drivers this board + PS-side bitstream loading rely on.

# --- FPGA manager / regions / run-time device-tree overlays ------------------
CONFIG_FPGA=y
CONFIG_FPGA_MGR_ZYNQMP_FPGA=y
CONFIG_FPGA_REGION=y
CONFIG_OF_FPGA_REGION=y
CONFIG_FPGA_BRIDGE=y
CONFIG_XILINX_PR_DECOUPLER=y
CONFIG_OF_OVERLAY=y
CONFIG_CONFIGFS_FS=y

# --- ZynqMP firmware / PM (PCAP path goes through the firmware driver) --------
CONFIG_ZYNQMP_FIRMWARE=y
CONFIG_ARCH_ZYNQMP=y

# --- Ethernet : Cadence GEM + Realtek RTL8211F PHY ---------------------------
CONFIG_MACB=y
CONFIG_REALTEK_PHY=y
CONFIG_MDIO_BUS=y

# --- storage : eMMC / SD (Arasan SDHCI) + QSPI NOR ---------------------------
CONFIG_MMC=y
CONFIG_MMC_SDHCI=y
CONFIG_MMC_SDHCI_OF_ARASAN=y
CONFIG_MTD=y
CONFIG_MTD_SPI_NOR=y
CONFIG_SPI_ZYNQMP_GQSPI=y

# --- root filesystem on ext4 (built-in so we can mount root without initramfs)
CONFIG_EXT4_FS=y

# --- buses / peripherals used by the board -----------------------------------
CONFIG_I2C_CADENCE=y
CONFIG_EEPROM_AT24=y
CONFIG_CAN=y
CONFIG_CAN_XILINXCAN=y
CONFIG_GPIO_ZYNQ=y
CONFIG_USB_DWC3=y
CONFIG_USB_DWC3_OF_SIMPLE=y

# --- handy on a dev board ----------------------------------------------------
CONFIG_GPIO_SYSFS=y
CONFIG_LEDS_GPIO=y
CONFIG_KEYBOARD_GPIO=y
